[tools]
go = "1.26"
staticcheck = "2026.1"

[tasks.build]
description = "Build the cliamp binary"
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o cliamp .
"""

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Run vet and staticcheck"
depends = ["vet"]
run = "staticcheck ./..."

[tasks.fmt]
description = "Format Go source files"
run = "gofmt -l -w ."

[tasks.check]
description = "Run fmt, vet, and test"
depends = ["fmt", "vet", "test"]

[tasks.clean]
description = "Remove the built binary"
run = "rm -f cliamp"

[tasks.install]
description = "Build and install cliamp to ~/.local/bin"
depends = ["build"]
run = """
install -d $HOME/.local/bin
install -m 755 cliamp $HOME/.local/bin/cliamp
"""
